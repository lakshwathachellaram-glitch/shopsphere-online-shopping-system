
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Wishlist - ShopSphere</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .wishlist-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .wishlist-card {
            padding: 20px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 4px 12px #ddd;
            text-align: center;
        }

        .wishlist-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .wishlist-card button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            background: #e74c3c;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="wishlist-container">

    <h1>❤️ My Wishlist</h1>

    <a href="/">← Continue Shopping</a>

    <div th:if="${#lists.isEmpty(wishlist)}">
        <h3>Your wishlist is empty.</h3>
    </div>

    <div class="wishlist-grid">

        <div class="wishlist-card" th:each="product : ${wishlist}">

            <img th:src="${product.image}" th:alt="${product.name}">

            <h3 th:text="${product.name}"></h3>

            <p>₹<span th:text="${product.price}"></span></p>

            <form action="/remove-from-wishlist" method="post">
                <input type="hidden" name="id" th:value="${product.id}">
                <button type="submit">Remove</button>
            </form>

        </div>

    </div>

</div>

</body>
</html>
