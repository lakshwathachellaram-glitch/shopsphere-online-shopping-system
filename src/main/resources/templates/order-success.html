
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order Successful - ShopSphere</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            text-align: center;
            padding: 60px 20px;
        }

        .box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ddd;
        }

        h1 {
            color: #28a745;
        }

        a {
            display: inline-block;
            margin: 10px;
            padding: 12px 20px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🎉 Order Placed Successfully!</h1>

    <p>Thank you for shopping with ShopSphere.</p>

    <h3>Order ID: <span th:text="${orderId}"></span></h3>

    <h2>Total: ₹<span th:text="${total}"></span></h2>

    <p>Your order has been recorded.</p>

    <a href="/">Continue Shopping</a>

    <a href="/order-history">My Orders</a>

</div>

</body>
</html>
