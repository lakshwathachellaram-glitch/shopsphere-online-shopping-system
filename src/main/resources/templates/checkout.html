
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere - Checkout</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .checkout-page {
            padding: 50px 8%;
        }

        .checkout-box {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        .checkout-item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
        }

        .checkout-total {
            text-align: right;
            margin-top: 25px;
            color: #6c4ce4;
        }

        .place-order-button {
            background: #6c4ce4;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .back-button {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #555;
        }

        .coupon-box {
            margin-top: 25px;
            padding: 20px;
            background: #f6f3ff;
            border-radius: 10px;
        }

        .coupon-box input {
            padding: 12px;
            width: 60%;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .coupon-box button {
            padding: 12px 15px;
            background: #6c4ce4;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .coupon-message {
            margin-top: 12px;
            color: #287a39;
        }

        .discount {
            color: green;
        }

        .remove-coupon {
            background: #d9534f !important;
            margin-top: 10px;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">ShopSphere</div>

    <nav>
        <a href="/">Home</a>
        <a href="/cart">Cart</a>
    </nav>
</header>

<section class="checkout-page">

    <div class="checkout-box">

        <h1>Checkout</h1>
        <p>Review your items before placing your order.</p>

        <!-- Cart Items -->

        <div class="checkout-item" th:each="item : ${cart}">
            <span>
                <b th:text="${item.product.name}"></b>
                <span th:text="| × ${item.quantity}|"></span>
            </span>

            <span th:text="|₹${item.subtotal}|"></span>
        </div>

        <!-- Coupon Section -->

        <div class="coupon-box">

            <h3>🎟️ Apply Coupon</h3>

            <p>Available codes: SHOP10, SHOP20, WELCOME50</p>

            <form action="/apply-coupon" method="post"
                  th:if="${couponCode == null}">

                <input type="text"
                       name="couponCode"
                       placeholder="Enter coupon code"
                       required>

                <button type="submit">Apply</button>

            </form>

            <div th:if="${couponCode != null}">

                <p>
                    Applied Coupon:
                    <strong th:text="${couponCode}"></strong>
                </p>

                <form action="/remove-coupon" method="post">
                    <button type="submit" class="remove-coupon">
                        Remove Coupon
                    </button>
                </form>

            </div>

            <p class="coupon-message"
               th:if="${couponMessage != null}"
               th:text="${couponMessage}">
            </p>

        </div>

        <!-- Price Calculation -->

        <div class="checkout-total">

            <div class="price-row">
                <span>Subtotal:</span>
                <span th:text="|₹${subtotal}|"></span>
            </div>

            <div class="price-row discount">
                <span>Discount:</span>
                <span th:text="|− ₹${discount}|"></span>
            </div>

            <hr>

            <div class="price-row">
                <h2>Final Total:</h2>
                <h2 th:text="|₹${total}|"></h2>
            </div>

        </div>

        <!-- Place Order -->

        <form action="/place-order" method="post">

            <button type="submit" class="place-order-button">
                Place Order
            </button>

        </form>

        <br>

        <a href="/cart" class="back-button">← Back to Cart</a>

    </div>

</section>

<footer>
    <h3>ShopSphere</h3>
    <p>Your everyday shopping destination.</p>
</footer>

</body>
</html>
