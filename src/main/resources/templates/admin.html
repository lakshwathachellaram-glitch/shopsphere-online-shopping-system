
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>ShopSphere Admin</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #ddd;
            text-align: center;
        }

        .card h2 {
            color: #555;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
            color: #2874c7;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #222;
            color: white;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 20px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📊 ShopSphere Admin Dashboard</h1>

    <div class="cards">

        <div class="card">
            <h2>Total Orders</h2>
            <p th:text="${totalOrders}"></p>
        </div>

        <div class="card">
            <h2>Total Customers</h2>
            <p th:text="${totalCustomers}"></p>
        </div>

        <div class="card">
            <h2>Total Sales</h2>
            <p>₹<span th:text="${totalSales}"></span></p>
        </div>

    </div>

    <h2>👥 Registered Customers</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Email</th>
        </tr>

        <tr th:each="customer : ${customers}">
            <td th:text="${customer.name}"></td>
            <td th:text="${customer.email}"></td>
        </tr>
    </table>

    <h2>📦 Orders</h2>

    <table>
        <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Email</th>
            <th>Total</th>
            <th>Date</th>
        </tr>

        <tr th:each="order : ${orders}">
            <td th:text="${order.orderId}"></td>
            <td th:text="${order.customerName}"></td>
            <td th:text="${order.email}"></td>
            <td>₹<span th:text="${order.total}"></span></td>
            <td th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm')}"></td>
        </tr>
    </table>

    <a href="/" class="back">Back to Shop</a>

</div>

</body>
</html>
