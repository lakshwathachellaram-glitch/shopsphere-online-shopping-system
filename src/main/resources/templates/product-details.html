
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Details - ShopSphere</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .details-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 25px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .details-container img {
            width: 100%;
            max-height: 450px;
            object-fit: contain;
        }

        .details-info {
            padding: 20px;
        }

        .details-info h1 {
            font-size: 32px;
        }

        .price {
            font-size: 25px;
            font-weight: bold;
        }

        .feature-btn {
            display: inline-block;
            padding: 12px 18px;
            background: #222;
            color: white;
            border: none;
            border-radius: 7px;
            margin: 8px 0;
            cursor: pointer;
        }

        .review-section {
            max-width: 900px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
        }

        .review-section input,
        .review-section select,
        .review-section textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        .review-card {
            padding: 15px;
            margin: 15px 0;
            background: #f4f4f4;
            border-radius: 8px;
        }

        @media(max-width: 700px) {
            .details-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="details-container">

    <div>
        <img th:src="${product.image}" th:alt="${product.name}">
    </div>

    <div class="details-info">

        <h1 th:text="${product.name}"></h1>

        <p>
            Category:
            <span th:text="${product.category}"></span>
        </p>

        <p th:text="${product.description}"></p>

        <p class="price">
            ₹<span th:text="${product.price}"></span>
        </p>

        <!-- Add to Cart -->
        <form action="/add-to-cart" method="post">
            <input type="hidden" name="id" th:value="${product.id}">
            <input type="hidden" name="name" th:value="${product.name}">
            <input type="hidden" name="price" th:value="${product.price}">
            <input type="hidden" name="image" th:value="${product.image}">
            <button class="feature-btn" type="submit">🛒 Add to Cart</button>
        </form>

        <!-- Add to Wishlist -->
        <form action="/add-to-wishlist" method="post">
            <input type="hidden" name="id" th:value="${product.id}">
            <input type="hidden" name="name" th:value="${product.name}">
            <input type="hidden" name="price" th:value="${product.price}">
            <input type="hidden" name="image" th:value="${product.image}">
            <input type="hidden" name="category" th:value="${product.category}">
            <button class="feature-btn" type="submit">❤️ Add to Wishlist</button>
        </form>

        <a href="/">← Continue Shopping</a>

    </div>

</div>

<!-- Reviews -->
<div class="review-section">

    <h2>⭐ Ratings & Reviews</h2>

    <form action="/add-review" method="post">

        <input type="hidden" name="productId" th:value="${product.id}">

        <input type="text"
               name="customerName"
               placeholder="Your name"
               required>

        <select name="rating" required>
            <option value="">Select Rating</option>
            <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
            <option value="4">⭐⭐⭐⭐ Very Good</option>
            <option value="3">⭐⭐⭐ Good</option>
            <option value="2">⭐⭐ Fair</option>
            <option value="1">⭐ Poor</option>
        </select>

        <textarea name="comment"
                  placeholder="Write your review"
                  rows="4"
                  required></textarea>

        <button class="feature-btn" type="submit">Submit Review</button>

    </form>

    <hr>

    <h3>Customer Reviews</h3>

    <div th:if="${#lists.isEmpty(reviews)}">
        <p>No reviews yet. Be the first to review!</p>
    </div>

    <div class="review-card" th:each="review : ${reviews}">

        <h4 th:text="${review.customerName}"></h4>

        <p>
            Rating:
            <span th:text="${review.rating}"></span>/5 ⭐
        </p>

        <p th:text="${review.comment}"></p>

    </div>

</div>

</body>
</html>
